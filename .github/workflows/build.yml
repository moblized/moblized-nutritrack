name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache USDA datasets
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: usda-${{ hashFiles('tools/build_food_db.py') }}
          restore-keys: usda-

      - name: Build offline food database
        id: db
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/build_food_db.py --out app/src/main/assets/usda.db --cache tools/cache 2>&1 | tee db.log

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee gradle.log

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = fails = skipped = 0
          lines = []
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0)); fails += int(r.get("failures", 0)) + int(r.get("errors", 0)); skipped += int(r.get("skipped", 0))
              out = r.findtext("system-out") or ""
              lines += [l for l in out.splitlines() if l.startswith(("MISMATCH", "EMOJI", "SHOT", "SUGGEST"))]
          msg = f"{total} tests, {fails} failed, {skipped} skipped%0A" + "%0A".join(lines[:160])
          print(f"::notice title=Unit tests::{msg}")
          PY

      - name: Publish UI screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls app/build/screenshots/*.png 2>/dev/null || exit 0
          gh release view screenshots >/dev/null 2>&1 || \
            gh release create screenshots --prerelease --title "UI screenshots" --notes "Rendered by CI from the latest build."
          gh release upload screenshots app/build/screenshots/*.png --clobber

      - name: Report errors
        if: steps.db.outcome == 'failure' || steps.gradle.outcome == 'failure'
        run: |
          python3 tools/ci_report.py db.log gradle.log
          exit 1

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/NutriTrack-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-apk
          path: out/*.apk

      - name: Release notes
        # The app's update prompt shows these as "What's new".
        run: git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > out/notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NutriTrack 1.0.${{ github.run_number }}
          body_path: out/notes.md
          files: out/*.apk
          make_latest: true
