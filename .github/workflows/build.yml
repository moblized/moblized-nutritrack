name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache USDA datasets
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: usda-${{ hashFiles('tools/build_food_db.py') }}
          restore-keys: usda-

      - name: Build offline food database
        run: python3 tools/build_food_db.py --out app/src/main/assets/usda.db --cache tools/cache

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/NutriTrack-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NutriTrack 1.0.${{ github.run_number }}
          files: out/*.apk
          make_latest: true
